# ==============================================================================
# Render Infrastructure as Code (Blueprint) for CodeArena
# Single service: Spring Boot (backend + Supabase, judge runs in Docker)
# serves the built React frontend as static files under the same origin.
# See backend/Dockerfile (multi-stage build) and
# backend/src/main/java/com/codearena/controller/FrontendController.java.
# ==============================================================================

services:
  - type: web
    name: codearena-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    # Build context is the repo root so the Dockerfile can COPY both
    # backend/ and frontend/ (frontend is built in the Dockerfile's first
    # stage, then copied into the final image).
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # JUDGE_ENGINE=docker is the production judge (isolated containers).
      # NOTE: the Docker judge needs a host with a Docker socket. Render's free
      # tier cannot mount one; on Render set JUDGE_ENGINE=local as a documented
      # dev fallback until the judge runs on Docker-enabled infrastructure.
      - key: JUDGE_ENGINE
        value: "docker"
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: MAX_CONCURRENT_EXECUTIONS
        value: "20"
      - key: CORS_ORIGINS
        # Same-origin now that one service serves both frontend and API, so
        # this is only a safety net for direct cross-origin API access.
        value: "http://localhost:5173"
      - key: JWT_SECRET
        # IMPORTANT: Set this to a stable, strong secret in the Render dashboard.
        # Using generateWith creates a new random secret on every deploy, which
        # invalidates all active student JWT tokens and logs everyone out mid-exam.
        # Set once, keep forever: openssl rand -hex 32
        sync: false
      - key: DATABASE_URL
        # Set this in the Render dashboard (pooler connection string, e.g.
        # postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres).
        # Not committed here — it's a live database credential.
        sync: false
      - key: CODE_TIMEOUT_SECONDS
        value: "15"
      - key: TIMEOUT_PYTHON
        value: "15.0"
      - key: TIMEOUT_JAVA
        value: "15.0"
      - key: TIMEOUT_C
        value: "15.0"
      - key: TIMEOUT_CPP
        value: "15.0"
      - key: CODE_MEMORY_LIMIT_KB
        value: "262144"
      - key: SUBMISSION_GRACE_PERIOD_SECONDS
        value: "5"
