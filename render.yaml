# ==============================================================================
# Render Infrastructure as Code (Blueprint) for CodeArena
# Backend:  Docker Web Service (FastAPI + Supabase, judge runs in Docker)
# Frontend: Static Site (React SPA) with SPA rewrite via public/static.json
# ==============================================================================

services:
  # ── Backend ────────────────────────────────────────────────────────────────
  - type: web
    name: codearena-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # JUDGE_ENGINE=docker is the production judge (isolated containers).
      # NOTE: the Docker judge needs a host with a Docker socket. Render's free
      # tier cannot mount one; on Render set JUDGE_ENGINE=local as a documented
      # dev fallback until the judge runs on Docker-enabled infrastructure.
      - key: JUDGE_ENGINE
        value: "docker"
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: MAX_CONCURRENT_EXECUTIONS
        value: "20"
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://codearena-indol.vercel.app,https://codearena-frontend.onrender.com"
      - key: JWT_SECRET
        # IMPORTANT: Set this to a stable, strong secret in the Render dashboard.
        # Using generateWith creates a new random secret on every deploy, which
        # invalidates all active student JWT tokens and logs everyone out mid-exam.
        # Set once, keep forever: openssl rand -hex 32
        sync: false
      - key: DATABASE_URL
        value: "postgresql://postgres:RagavDeepika1430@db.vubpgeagtfpqdojdiqtc.supabase.co:5432/postgres"
      - key: CODE_TIMEOUT_SECONDS
        value: "15"
      - key: TIMEOUT_PYTHON
        value: "15.0"
      - key: TIMEOUT_JAVA
        value: "15.0"
      - key: TIMEOUT_C
        value: "15.0"
      - key: TIMEOUT_CPP
        value: "15.0"
      - key: CODE_MEMORY_LIMIT_KB
        value: "262144"
      - key: SUBMISSION_GRACE_PERIOD_SECONDS
        value: "5"

  # ── Frontend (Render Static Site) ──────────────────────────────────────────
  - type: web
    name: codearena-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    plan: free
    region: singapore
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: "https://codearena-api.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
