# ==============================================================================
# Render Infrastructure as Code (Blueprint) for CodeArena
# Backend:  Docker Web Service (FastAPI + in-container compilers)
# Frontend: Static Site (React SPA) with SPA rewrite via public/static.json
# ==============================================================================

services:
  # ── Backend ────────────────────────────────────────────────────────────────
  - type: web
    name: codearena-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ALLOW_LOCAL_EXECUTION
        value: "True"
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: MAX_CONCURRENT_EXECUTIONS
        value: "20"
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://codearena-indol.vercel.app,https://codearena-frontend.onrender.com"
      - key: JWT_SECRET
        # IMPORTANT: Set this to a stable, strong secret in the Render dashboard.
        # Using generateWith creates a new random secret on every deploy, which
        # invalidates all active student JWT tokens and logs everyone out mid-exam.
        # Set once, keep forever: openssl rand -hex 32
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CODE_TIMEOUT_SECONDS
        value: "15"
      - key: TIMEOUT_PYTHON
        value: "15.0"
      - key: TIMEOUT_JAVA
        value: "15.0"
      - key: TIMEOUT_C
        value: "15.0"
      - key: TIMEOUT_CPP
        value: "15.0"
      - key: CODE_MEMORY_LIMIT_KB
        value: "262144"
      - key: SUBMISSION_GRACE_PERIOD_SECONDS
        value: "5"

  # ── Frontend (Render Static Site) ──────────────────────────────────────────
  - type: web
    name: codearena-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    plan: free
    region: singapore
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: "https://codearena-api.onrender.com"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
